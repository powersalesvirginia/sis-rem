<style>
:root{
  --navy:#0E3A5D; --blue:#17608F; --blue-soft:#E8F1F7; --ink:#1B2733;
  --bg:#EEF3F6; --card:#FFFFFF; --line:#D8E2EA; --mut:#5B7285;
  --yellow:#FFC400; --yellow-soft:#FFF4CC;
  --green:#1E8E5A; --green-soft:#DDF2E6;
  --red:#D93025; --red-soft:#FBE3E1;
  --amber:#E8950C; --amber-soft:#FDEBC8;
  --r:10px; --shadow:0 2px 10px rgba(14,58,93,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
h1,h2,h3{font-family:'Archivo',sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,96,143,.15)}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;letter-spacing:.02em}
.btn:hover{background:var(--blue)}
.btn.yellow{background:var(--yellow);color:var(--navy)}
.btn.yellow:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.danger{background:var(--red)} .btn.green{background:var(--green)}
.btn.sm{padding:5px 10px;font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tag.previa{background:#E4E9EE;color:var(--mut)}
.tag.parcial{background:var(--amber-soft);color:var(--amber)}
.tag.pronto{background:var(--blue-soft);color:var(--blue)}
.tag.validado{background:var(--green-soft);color:var(--green)}
.tag.diverg{background:var(--red-soft);color:var(--red)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--navy) 0%,#12507E 55%,#17608F 100%);padding:20px}
.login-card{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand-mark{width:44px;height:44px;border-radius:10px;background:var(--navy);color:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:800;font-size:20px}
.brand h1{font-size:24px;font-weight:800;letter-spacing:.06em;color:var(--navy)}
.brand small{display:block;color:var(--mut);font-weight:500;letter-spacing:.02em;font-family:'IBM Plex Sans';font-size:12px}
.login-card label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.login-card input{width:100%}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.login-hint{margin-top:18px;padding:12px;background:var(--blue-soft);border-radius:8px;font-size:12px;color:var(--mut);line-height:1.5}
header.app{background:var(--navy);color:#fff;padding:0 22px;display:flex;align-items:center;gap:18px;height:58px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
header .brand-mark{width:32px;height:32px;font-size:15px;background:var(--yellow);color:var(--navy)}
header .title{font-family:'Archivo';font-weight:800;font-size:17px;letter-spacing:.08em}
header .spacer{flex:1}
header select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font-weight:600}
header select option{color:var(--ink)}
.userchip{display:flex;align-items:center;gap:10px;font-size:13px}
.userchip b{display:block;font-size:13px}
.userchip small{color:#BBD3E4;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:58px;z-index:40}
nav.tabs button{background:none;border:none;padding:13px 15px;font-size:13px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--yellow)}
main{padding:22px;max-width:1450px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}

/* ===== FIRESTORE — estrutura separada por documento ===== *
 *
 * Documentos no Firestore:
 *   sisrem/config  → config, meses, operacoes, usuarios, perfis, folhas
 *   sisrem/lanc_AAAA-MM → lançamentos do mês (ex: lanc_2026-07)
 *   sisrem/valid   → pareceres e fechamento
 *
 * DB em memória mantém a mesma estrutura de antes para o restante
 * do código não precisar mudar.
 ========================================================= */

const DOC_CONFIG  = () => doc(db,'sisrem','config');
const DOC_LANC    = (mes) => doc(db,'sisrem','lanc_'+(mes||DB.config.mesRef));
const DOC_VALID   = () => doc(db,'sisrem','valid');

/* persist: salva apenas o que mudou */
let _persistTimer = null;
async function persist(partes){
  // partes = array de 'config'|'lanc'|'valid' — se omitido, salva tudo
  const salvar = partes || ['config','lanc','valid'];
  try{
    const proms = [];
    if(salvar.includes('config')){
      proms.push(setDoc(DOC_CONFIG(), {
        versao:   DB.versao||1,
        config:   DB.config,
        meses:    DB.meses,
        operacoes:DB.operacoes,
        usuarios: DB.usuarios,
        perfis:   DB.perfis,
        folhas:   DB.folhas,
      }));
    }
    if(salvar.includes('lanc')){
      proms.push(setDoc(DOC_LANC(), {
        mes:  DB.config.mesRef,
        lanc: (DB.lanc||{})[DB.config.mesRef]||{}
      }));
    }
    if(salvar.includes('valid')){
      proms.push(setDoc(DOC_VALID(), {
        pareceres:  DB.pareceres||[],
        fechamento: DB.fechamento||{},
        justificativas: DB.justificativas||[],
        checkRns: DB.checkRns||{},
        feristaObs: DB.feristaObs||{},
        rnStatus: DB.rnStatus||{}
      }));
    }
    await Promise.all(proms);
  }catch(e){ toast('Erro ao salvar: '+e.message); }
}

/* persistConfig: atalho para salvar só config (folhas, perfis, usuários) */
function persistConfig(){ return persist(['config']); }
/* persistLanc: atalho para salvar só lançamentos do mês atual */
function persistLanc(){   return persist(['lanc']);   }
/* persistValid: atalho para salvar só pareceres/fechamento */
function persistValid(){  return persist(['valid']);  }

/* carregarLanc: carrega lançamentos de um mês específico */
async function carregarLanc(mes){
  const snap = await getDoc(DOC_LANC(mes));
  DB.lanc = DB.lanc || {};
  DB.lanc[mes] = snap.exists() ? (snap.data().lanc||{}) : {};
}

let _unsubConfig=null, _unsubValid=null;

function subscribeDB(callback){
  // Cancelar listeners anteriores
  if(_unsub){_unsub();_unsub=null;}
  if(_unsubConfig){_unsubConfig();_unsubConfig=null;}
  if(_unsubValid){_unsubValid();_unsubValid=null;}

  let configOk=false, validOk=false, lancOk=false;
  let _firstConfig=true, _firstValid=true;
  DB = DB||{};
  DB.lanc = {};

  function checkReady(){
    if(configOk && validOk && lancOk) callback();
  }

  // Re-renderizar só o conteúdo da página atual, sem resetar PAGE
  function softRender(){
    if(!SESS || !DB) return;
    // Se está numa tela de cadastro/config em edição, só atualiza dados em background
    // sem forçar re-render (evita perder foco/estado de formulários)
    const paginasComFormulario = ['cadastros','config','senha','lanc'];
    if(paginasComFormulario.includes(PAGE)){
      // Só atualiza dados em memória, não re-renderiza
      return;
    }
    // Para consolidado, validação e folha: atualiza normalmente
    render();
  }

  // 1. Listener em config (tempo real)
  _unsubConfig = onSnapshot(DOC_CONFIG(), async snap => {
    if(snap.exists()){
      const d = snap.data();
      DB.versao    = d.versao||1;
      DB.config    = d.config||{mesRef:'2026-07'};
      DB.meses     = d.meses||{};
      DB.operacoes = d.operacoes||[];
      DB.usuarios  = d.usuarios||[];
      DB.perfis    = d.perfis||[];
      DB.folhas    = d.folhas||[];
      configOk=true;
      await carregarLanc(DB.config.mesRef);
      lancOk=true;
      // Migração v2: converte logins antigos (nome) para padronizados (gvN.op)
      if(validOk){ try{ await migrarV2(); await migrarV3(); }catch(e){ console.warn('migrar',e); } }
      if(_firstConfig){ _firstConfig=false; checkReady(); }
      else if(validOk){ softRender(); } // atualização de outro usuário
    } else {
      await initSeed();
      configOk=true; lancOk=true;
      _firstConfig=false;
      checkReady();
    }
  }, err => toast('Erro config: '+err.message));

  // 2. Listener em valid (tempo real)
  _unsubValid = onSnapshot(DOC_VALID(), snap => {
    if(snap.exists()){
      const d = snap.data();
      DB.pareceres      = d.pareceres||[];
      DB.fechamento     = d.fechamento||{};
      DB.justificativas = d.justificativas||[];
      DB.checkRns    = d.checkRns||{};
      DB.feristaObs  = d.feristaObs||{};
      DB.rnStatus    = d.rnStatus||{};
    } else {
      DB.pareceres      = [];
      DB.fechamento     = {};
      DB.justificativas = [];
      DB.checkRns    = {};
      DB.feristaObs  = {};
      DB.rnStatus    = {};
    }
    validOk=true;
    if(_firstValid){ _firstValid=false; checkReady(); }
    else if(configOk && lancOk){ softRender(); } // atualização de outro usuário
  }, err => toast('Erro valid: '+err.message));
}

function ehPerfilGerente(perfilId){
  var p=(DB.perfis||[]).find(function(x){return x.id===perfilId;});
  return p ? /^g[vc]\b|^g[vc]\s|gerente/i.test(p.nome) : false;
}
async function migrarV3(){
  // Roda sempre que existir folha de gerente SEM vínculo (não depende de flag de versão)
  var folhasGer = (DB.folhas||[]).filter(function(f){return ehPerfilGerente(f.perfil);});
  var semVinculo = folhasGer.filter(function(f){return !f.userId;});
  if(!semVinculo.length) return false; // nada a fazer

  var gvs = (DB.usuarios||[]).filter(function(u){return u.papel==='gv';});
  var usados = {};
  folhasGer.forEach(function(f){ if(f.userId) usados[f.userId]=true; });

  var mudou=false;
  semVinculo.forEach(function(f){
    var prim = String(f.nome||'').trim().split(/\s+/)[0].toUpperCase();
    var cand = gvs.filter(function(u){
      return (u.ops||[]).indexOf(f.op)>=0 && String(u.nome).trim().split(/\s+/)[0].toUpperCase()===prim && !usados[u.id];
    });
    if(cand.length!==1){
      cand = gvs.filter(function(u){ return (u.ops||[]).indexOf(f.op)>=0 && !usados[u.id]; });
    }
    if(cand.length===1){
      f.userId = cand[0].id;
      usados[cand[0].id] = true;
      mudou=true;
    }
  });
  if(mudou){ await persist(["config"]); console.log('migrarV3: folhas de GV vinculadas'); }
  return mudou;
}

const userOps = u => u.papel==='admin'?DB.operacoes.map(o=>o.id):(u.ops||[]);
function folhasVisiveis(u){
  const ops=userOps(u);
  let fs=DB.folhas.filter(f=>ops.includes(f.op));
  if(u.papel==='gv'&&u.setores&&u.setores.trim()){
    const st=u.setores.split(',').map(s=>s.trim()).filter(Boolean);
    fs=fs.filter(f=>{
      // RN Reserva: sem setor fixo → visível para todos os GVs da operação
      if(f.perfil==='rn_reserva'||!f.setor||f.setor.trim()==='') return true;
      return st.includes(f.setor);
    });
  }
  return fs;
}
function atingKPI(l,k){
  if(!l||l.meta==null||l.meta===0||l.real==null)return null;
  var pct=l.real/l.meta*100;
  // Regra especial: KPI marcado como "tetoNoMax" (medido de 0 a 100%).
  // Bater 100% da meta paga o teto de 125%. Abaixo de 100%, mantém o valor normal.
  if(k&&k.tetoNoMax){
    return pct>=100 ? 125 : pct;
  }
  return Math.min(pct,125);
}
// normaliza nome de KPI: minúsculo, sem acento, sem espaços extras
function normKPI(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
// busca o lançamento de um KPI aceitando pequenas diferenças de nome
function lancDoKPI(lanc, nomeKPI){
  if(lanc[nomeKPI]) return lanc[nomeKPI];           // match exato (rápido)
  const alvo=normKPI(nomeKPI);
  for(const chave in lanc){
    if(normKPI(chave)===alvo) return lanc[chave];   // match tolerante
  }
  return null;
}
function calcFolha(f,mes){
  const p=perfilDe(f); if(!p)return null;
  const lanc=(DB.lanc[mes]||{})[f.id]||{};
  const itens=p.kpis.map(k=>{
    const l=lancDoKPI(lanc, k.k), a=atingKPI(l,k);
    const vItem=f.base*k.peso/100;
    return{...k,meta:l&&l.meta!=null?l.meta:null,real:l&&l.real!=null?l.real:null,ating:a,vItem,rs:a==null?0:vItem*a/100};
  });
  const atingTotal=itens.reduce((s,i)=>s+(i.ating??0)*i.peso/100,0);
  const total=itens.reduce((s,i)=>s+i.rs,0);
  const cfg=DB.meses[mes]||{dUteis:0,nUteis:0,dRealiz:0};
  const dsr=cfg.dUteis?total/cfg.dUteis*(cfg.nUteis||0):0;
  return{itens,atingTotal,total,dsr,cfg};
}
function statusOp(mes,op){
  const fech=(DB.fechamento[mes]||{})[op];
  if(fech==='validado')return{tag:'validado',txt:'Validado'};
  const ps=DB.pareceres.filter(p=>p.mes===mes&&p.op===+op);
  const temGV=ps.some(p=>p.papel==='gv'), temGC=ps.some(p=>p.papel==='gc');
  const div=ps.some(p=>p.status==='divergencia');
  if(div)return{tag:'diverg',txt:'Com divergência'};
  if(temGV&&temGC)return{tag:'pronto',txt:'Pronto p/ validar'};
  if(temGV||temGC)return{tag:'parcial',txt:'Parecer parcial'};
  return{tag:'previa',txt:'Prévia'};
}

/* ===== CONSOLIDADO ===== */
/* ===== GV responsável por um RN (via operação + setor) ===== */
function gvDaFolha(f){
  return DB.usuarios.filter(function(u){
    if(u.papel!=='gv') return false;
    if(!(u.ops||[]).includes(f.op)) return false;
    if(f.perfil==='rn_reserva'||!f.setor||f.setor.trim()===''){
      return true; // reserva pertence a todos os GVs da operação
    }
    if(u.setores&&u.setores.trim()){
      var st=u.setores.split(',').map(function(s){return s.trim();});
      return st.includes(f.setor);
    }
    return true;
  });
}

function pgConsolidado(el,u){
  const mes=DB.config.mesRef, perfis=DB.perfis;
  var perfisRN0=DB.perfis.filter(function(x){return !/^g[vc]\b|^g[vc]\s|gerente/i.test(x.nome);});
  var perfilSel=(PAGE_ARG&&PAGE_ARG.perfil!=null)?PAGE_ARG.perfil:'todos';  // padrão: todos
  // se um perfil específico foi escolhido mas é de gerente, volta a 'todos'
  if(perfilSel!=='todos' && !perfisRN0.some(function(x){return x.id===perfilSel;})) perfilSel='todos';
  var verTodos=(perfilSel==='todos');
  const opsU=userOps(u), opSel=(PAGE_ARG&&PAGE_ARG.op!=null)?PAGE_ARG.op:'todas';
  const gvSel=(PAGE_ARG&&PAGE_ARG.gv!=null)?PAGE_ARG.gv:'todos';
  var idsRN=perfisRN0.map(function(x){return x.id;});
  let fs=folhasVisiveis(u).filter(function(f){return verTodos?idsRN.includes(f.perfil):f.perfil===perfilSel;});
  if(opSel!=='todas')fs=fs.filter(function(f){return f.op===+opSel;});
  if(gvSel!=='todos')fs=fs.filter(function(f){return gvDaFolha(f).some(function(g){return g.id===gvSel;});});
  const p=verTodos?null:DB.perfis.find(function(x){return x.id===perfilSel;});
  // Feristas/reserva não entram no ranking — vão para um bloco à parte embaixo
  const ehFerista=function(f){return f.perfil==='rn_reserva'||f.reserva||!f.setor||String(f.setor).trim()==='';};
  const linhas=fs.map(function(f){return {f:f,c:calcFolha(f,mes)};}).filter(function(x){return x.c && !ehFerista(x.f);}).sort(function(a,b){return b.c.atingTotal-a.c.atingTotal;});
  // feristas da operação (independente do perfil selecionado, para não sumirem ao trocar filtro)
  var fsFerista=folhasVisiveis(u).filter(ehFerista);
  if(opSel!=='todas')fsFerista=fsFerista.filter(function(f){return f.op===+opSel;});
  if(gvSel!=='todos')fsFerista=fsFerista.filter(function(f){return gvDaFolha(f).some(function(g){return g.id===gvSel;});});
  fsFerista.sort(function(a,b){return a.op-b.op||String(a.nome).localeCompare(String(b.nome));});
  const podeJustificar=u.papel==='gv'||u.papel==='gc';
  const podeCheck=u.papel==='gv'||u.papel==='gc';
  const ehAdmin=u.papel==='admin';
  const justsTotal=(DB.justificativas||[]).filter(function(j){return j.mes===mes;});
  const pendAdmin=ehAdmin?justsTotal.filter(function(j){return j.status==='pendente';}).length:0;

  var perfisRN=perfis.filter(function(x){return !/^g[vc]\b|^g[vc]\s|gerente/i.test(x.nome);});
  var optsPerf='<option value="todos" '+(perfilSel==='todos'?'selected':'')+'>Todos os perfis</option>'+perfisRN.map(function(x){return '<option value="'+x.id+'" '+(x.id===perfilSel?'selected':'')+'>'+esc(x.nome)+'</option>';}).join('');
  var optsOp='<option value="todas">Todas as operações</option>'+DB.operacoes.filter(function(o){return opsU.includes(o.id);}).map(function(o){return '<option value="'+o.id+'" '+(''+o.id===''+opSel?'selected':'')+'>'+o.id+' — '+esc(o.nome)+'</option>';}).join('');

  // GVs disponíveis conforme operação selecionada (e escopo do usuário)
  var gvsDisp=DB.usuarios.filter(function(g){
    if(g.papel!=='gv') return false;
    var gvOps=g.ops||[];
    if(!gvOps.some(function(o){return opsU.includes(o);})) return false;
    if(opSel!=='todas' && !gvOps.includes(+opSel)) return false;
    return true;
  }).sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var optsGv='<option value="todos">Todos os GVs</option>'+gvsDisp.map(function(g){
    var opNome=(g.ops||[]).map(function(o){var oo=opDe(o);return oo?oo.nome:o;}).join('/');
    return '<option value="'+g.id+'" '+(g.id===gvSel?'selected':'')+'>'+esc(g.nome)+' ('+esc(opNome)+')</option>';
  }).join('');
  var btnPend=ehAdmin&&pendAdmin>0?'<button class="btn yellow sm" onclick="abrirPainelJust()">⚠ '+pendAdmin+' justificativa(s)</button>':'';

    ((ehAdmin||u.papel==='gc')?'<select onchange="setFiltro(\'gv\',this.value)">'+optsGv+'</select>':'')+'</h2>';

  // Barra de progresso de checks (GV/GC)
  if(podeCheck && linhas.length>0){
    var opsNaView=[...new Set(linhas.map(function(x){return x.f.op;}))];
    opsNaView.forEach(function(opId){
      var fsDaOp=linhas.filter(function(x){return x.f.op===opId;});
      var total=fsDaOp.length;
      var checks=fsDaOp.filter(function(x){return (DB.checkRns&&DB.checkRns[mes]&&DB.checkRns[mes][u.id+'_'+x.f.id]);}).length;
      var pct=total?Math.round(checks/total*100):0;

      html2+='<div style="margin-bottom:12px">'+

        '<span id="prog-label-'+opId+'">'+checks+'/'+total+' aprovados</span></div>'+
        '<div class="progresso-bar"><div class="progresso-bar-fill" id="prog-fill-'+opId+'" style="width:'+pct+'%"></div></div>'+
        '<div class="status-op-check '+stCls+'" id="prog-status-'+opId+'">'+stTxt+'</div>'+
        '</div>';
    });
  }

  // Resumo de checks para Admin
  if(ehAdmin && linhas.length>0){
    var opsAdmin=[...new Set(linhas.map(function(x){return x.f.op;}))];
    html2+='<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">';
    opsAdmin.forEach(function(opId){
      var resumo=resumoChecksOp(mes,opId);
      var opNome=opDe(opId)?opDe(opId).nome:opId;
      html2+='<div style="background:#F0F4F8;border-radius:8px;padding:10px 14px;font-size:12px;min-width:180px">';
      html2+='<div style="font-weight:700;color:var(--navy);margin-bottom:6px">Op. '+opId+' — '+esc(opNome)+'</div>';
      if(!resumo.length){html2+='<span style="color:var(--mut)">Sem GVs atribuídos</span>';}
      resumo.forEach(function(r){
        var ok=r.checks===r.total&&r.total>0;
        html2+='<div style="display:flex;justify-content:space-between;gap:8px;padding:2px 0">';
        html2+='<span>'+esc(r.gv.nome)+'</span>';
        html2+='<span style="font-weight:700;color:'+(ok?'var(--green)':r.checks>0?'var(--amber)':'var(--mut)')+'">'+r.checks+'/'+r.total+(ok?' ✔':'')+'</span>';
        html2+='</div>';
      });
      html2+='</div>';
    });
    html2+='</div>';
  }

  if((!p&&!verTodos)||!linhas.length){
    html2+='<div class="empty">Nenhuma folha com lançamentos para este filtro.</div>';
  } else {
    var thKpis=verTodos?'<th>Perfil</th>':p.kpis.map(function(k){return '<th>'+esc(k.k)+'</th>';}).join('');
    var thExtra='';
    if(ehAdmin){
      thExtra='<th>GV Aprovou</th><th>Justif.</th>';
    } else {
      if(podeJustificar) thExtra+='<th>Justif.</th>';
      if(podeCheck) thExtra+='<th title="Marque os RNs que você revisou e aprovou">✔ OK</th>';
    }

    var rows='';
    linhas.forEach(function(x){
      var fid=x.f.id;
      var justs=justsTotal.filter(function(j){return j.folhaId===fid;});
      var temPend=justs.some(function(j){return j.status==='pendente';});
      var temJust=justs.length>0;
      var badgeCls='vazia',badgeTxt='+';
      if(temPend){badgeCls='pendente';badgeTxt='!';}
      else if(temJust){var ult=justs[justs.length-1];if(ult.status==='aprovada'){badgeCls='aprovada';badgeTxt='✔';}else if(ult.status==='reprovada'){badgeCls='reprovada';badgeTxt='✗';}}

      var chkObj=podeCheck&&DB.checkRns&&DB.checkRns[mes]?DB.checkRns[mes][u.id+'_'+fid]:null;
      var chkOk=chkObj&&chkObj.ok;
      var chkTitle=chkOk?'Aprovado por você em '+chkObj.data:'Clique para marcar como "De acordo"';

      var kpiCells;
      if(verTodos){
        var pf=perfilDe(x.f);
        kpiCells='<td data-fid="'+fid+'" style="font-size:11px">'+(pf?esc(pf.nome):'—')+'</td>';
      } else {
        kpiCells=x.c.itens.map(function(i){return '<td class="'+classAting(i.ating)+'" data-fid="'+fid+'">'+fmtPct(i.ating)+'</td>';}).join('');
      }
      var justCell='';
      var checkCell='';

      if(ehAdmin){
        // Coluna "GV Aprovou": lista todos os GVs da operação e mostra se cada um aprovou
        var gvsDaOp=DB.usuarios.filter(function(gv){
          if(gv.papel!=='gv') return false;
          if(!(gv.ops||[]).includes(x.f.op)) return false;
          // se GV tem setores restritos, verificar se este RN está no escopo dele
          if(gv.setores&&gv.setores.trim()){
            var st=gv.setores.split(',').map(function(s){return s.trim();});
            if(x.f.setor&&!st.includes(x.f.setor)&&x.f.perfil!=='rn_reserva') return false;
          }
          return true;
        });
        var gvAprovCell='<td style="text-align:center;min-width:110px">';
        if(!gvsDaOp.length){
          gvAprovCell+='<span style="color:var(--mut);font-size:11px">—</span>';
        } else {
          gvsDaOp.forEach(function(gv){
            var gvChk=(DB.checkRns&&DB.checkRns[mes])?DB.checkRns[mes][gv.id+'_'+fid]:null;
            var gvOk=gvChk&&gvChk.ok;
            var tooltip=gvOk?esc(gv.nome)+' aprovou em '+esc(gvChk.data):esc(gv.nome)+' ainda não aprovou';
            gvAprovCell+='<span title="'+tooltip+'" style="display:inline-flex;align-items:center;gap:3px;'+
              'background:'+(gvOk?'var(--green-soft)':'#F0F4F8')+';'+
              'color:'+(gvOk?'var(--green)':'var(--mut)')+';'+
              'border:1px solid '+(gvOk?'var(--green)':'var(--line)')+';'+
              'border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700;margin:1px">'+
              (gvOk?'✔ ':'')+esc(gv.nome.split(' ')[0])+'</span>';
          });
        }
        gvAprovCell+='</td>';
        justCell=gvAprovCell+
          '<td style="text-align:center"><button class="just-badge '+badgeCls+'" data-just="'+fid+'" title="Justificativas">'+badgeTxt+'</button></td>';
      } else {
        if(podeJustificar){
          justCell='<td style="text-align:center"><button class="just-badge '+badgeCls+'" data-just="'+fid+'" title="Justificativas">'+badgeTxt+'</button></td>';
        }
        if(podeCheck){
          checkCell='<td style="text-align:center"><button class="check-rn'+(chkOk?' ok':'')+'" data-check="'+fid+'" title="'+esc(chkTitle)+'">'+(chkOk?'✔':'○')+'</button></td>';
        }
      }

      rows+='<tr data-fid="'+fid+'"'+( chkOk&&!ehAdmin?' style="opacity:.85"':'')+'>'+
        '<td><b>'+x.f.op+'_'+esc(x.f.setor)+'</b></td>'+
        '<td class="l">'+esc(x.f.nome)+statusTag(fid)+' <button class="rn-status-btn" data-status="'+fid+'" title="Marcar Férias / Atestado / Novo">⚑</button></td>'+
        kpiCells+
        '<td class="'+classTotal(x.c.atingTotal)+'" data-fid="'+fid+'">'+fmtPct(x.c.atingTotal)+'</td>'+
        '<td data-fid="'+fid+'">'+arrow(x.c.atingTotal)+'</td>'+
        '<td style="text-align:right" data-fid="'+fid+'">'+comissaoCell(fid,x.c.total,ocultar)+'</td>'+
        justCell+checkCell+'</tr>';
    });

    // ===== MÉDIAS E TOTAIS =====
    var nRns=linhas.length;
    // média de atingimento por KPI (só quando um perfil específico está selecionado)
    var mediasKpi=verTodos?[]:p.kpis.map(function(k,ki){
      var vals=linhas.map(function(x){return x.c.itens[ki]?x.c.itens[ki].ating:null;}).filter(function(v){return v!=null;});
      if(!vals.length) return null;
      return vals.reduce(function(s,v){return s+v;},0)/vals.length;
    });
    var mediaAting=(function(){
      var vals=linhas.map(function(x){return x.c.atingTotal;}).filter(function(v){return v!=null;});
      return vals.length?vals.reduce(function(s,v){return s+v;},0)/vals.length:0;
    })();
    var somaComissao=linhas.reduce(function(s,x){return s+valorPago(x.f.id,x.c.total||0,x.f.base||0).pago;},0);
    var mediaComissao=nRns?somaComissao/nRns:0;

    var tfKpiCells=verTodos?'<td></td>':mediasKpi.map(function(m){return '<td class="'+classAting(m)+'"><b>'+(m==null?'—':fmtPct(m))+'</b></td>';}).join('');
    var colExtra=(ehAdmin?2:0)+((podeJustificar&&!ehAdmin)?1:0)+((podeCheck&&!ehAdmin)?1:0);
    var tfExtra=colExtra>0?'<td colspan="'+colExtra+'"></td>':'';

    var tfoot='<tfoot>'+
      '<tr style="background:var(--navy);color:#fff;font-weight:800">'+
        '<td colspan="2" style="text-align:left;font-family:\'Archivo\'">MÉDIA · '+nRns+' RN(s)</td>'+
        tfKpiCells+
        '<td class="'+classTotal(mediaAting)+'" style="color:#fff">'+fmtPct(mediaAting)+'</td>'+
        '<td></td>'+
        '<td style="text-align:right">'+(ocultar?'R$ ••••':fmtBRL(mediaComissao))+'</td>'+
        tfExtra+
      '</tr>'+
      '<tr style="background:var(--blue);color:#fff;font-weight:700;font-size:12px">'+
        '<td colspan="2" style="text-align:left">SOMA COMISSÃO</td>'+
        '<td colspan="'+(verTodos?1:p.kpis.length)+'"></td>'+
        '<td colspan="2"></td>'+
        '<td style="text-align:right;font-family:\'Archivo\';font-size:14px">'+(ocultar?'R$ ••••••':fmtBRL(somaComissao))+'</td>'+
        tfExtra+
      '</tr>'+
    '</tfoot>';

    html2+='<div class="tbl-wrap"><table class="data" id="tbl-consol">'+
      '<thead><tr><th>Setor</th><th style="text-align:left">Nome</th>'+thKpis+
      '<th>% Ating</th><th></th><th>R$ Comissão</th>'+thExtra+'</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+tfoot+'</table></div>'+
      '<div class="help">Clique na linha para abrir a folha · ✔ OK = RN revisado pelo GV · ! = justificativa pendente · Médias calculadas sobre os '+nRns+' RN(s) do filtro atual</div>';
  }

  // ===== BLOCO DE FERISTAS / RESERVA (fora do ranking) =====
  if(fsFerista.length){
    var fo=(DB.feristaObs||{})[mes]||{};
    html2+='<div class="card" style="border:2px solid var(--amber)"><h2 style="color:var(--amber)">🔄 Feristas / Reserva · '+mesLabel(mes)+'<span class="fill"></span><span style="font-size:12px;color:var(--mut);font-weight:600">'+fsFerista.length+' RN(s) — fora do ranking</span></h2>';
    html2+='<div class="help" style="margin-bottom:12px">Substitutos da operação. Escreva a observação e informe o valor a pagar manualmente. Não entram no ranking nem nas médias.</div>';
    fsFerista.forEach(function(f){
      var reg=fo[f.id]||{obs:'',valor:0};
      var opNome=opDe(f.op)?opDe(f.op).nome:f.op;
      html2+='<div class="ferista-card">';
      html2+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">';
      html2+='<span style="background:var(--amber);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">FERISTA</span>';
      html2+='<b style="font-size:14px">'+esc(f.nome)+'</b>';
      html2+='<span style="color:var(--mut);font-size:12px">Op. '+f.op+' — '+esc(opNome)+'</span>';
      html2+=statusTag(f.id)+' <button class="rn-status-btn" data-status="'+f.id+'">⚑ status</button>';
      html2+='<span class="fill"></span>';
      html2+='<div class="fld" style="margin:0"><label style="font-size:10px">Valor a pagar (R$)</label>';
      html2+='<input type="number" step="0.01" value="'+(reg.valor||0)+'" style="width:130px;text-align:right;font-weight:700" data-ferval="'+f.id+'"></div>';
      html2+='</div>';
      html2+='<textarea placeholder="Observação (ex: cobriu setor 105 por 12 dias, férias do titular...)" data-ferobs="'+f.id+'">'+esc(reg.obs||'')+'</textarea>';
      if(reg.userName){
        var papelLbl=reg.userPapel==='admin'?'Admin':reg.userPapel==='gc'?'GC':reg.userPapel==='gv'?'GV':'';
        html2+='<div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--mut);background:#F0F4F8;border-radius:6px;padding:5px 10px;width:fit-content">';
        html2+='<span style="font-size:13px">✍️</span>';
        html2+='<span>Preenchido por <b style="color:var(--navy)">'+esc(reg.userName)+'</b>';
        if(reg.userLogin) html2+=' <span style="color:var(--mut)">('+esc(reg.userLogin)+(papelLbl?' · '+papelLbl:'')+')</span>';
        html2+=' em '+esc(reg.data||'')+'</span></div>';
      } else {
        html2+='<div style="margin-top:8px;font-size:11px;color:var(--mut);font-style:italic">Ainda não preenchido.</div>';
      }
      html2+='</div>';
    });
    // total feristas
    var totFer=fsFerista.reduce(function(s,f){return s+(((fo[f.id]||{}).valor)||0);},0);
    html2+='<div style="text-align:right;font-weight:800;font-family:\'Archivo\';color:var(--navy);padding:8px 4px">Total feristas: '+(ocultar?'R$ ••••••':fmtBRL(totFer))+'</div>';
    html2+='</div>';
  }

  html2+='</div>';
  el.innerHTML=html2;

  // Listeners do bloco de feristas (valor + observação) com debounce
  el.querySelectorAll('[data-ferval]').forEach(function(inp){
    inp.addEventListener('change',function(){ salvarFerista(inp.getAttribute('data-ferval'),{valor:+inp.value||0}); });
  });
  el.querySelectorAll('[data-ferobs]').forEach(function(ta){
    var t=null;
    ta.addEventListener('input',function(){ clearTimeout(t); t=setTimeout(function(){ salvarFerista(ta.getAttribute('data-ferobs'),{obs:ta.value}); },700); });
  });
  // Botões de status fora da tabela (no bloco ferista)
  el.querySelectorAll('[data-status]').forEach(function(b){
    if(b.closest('#tbl-consol')) return; // os da tabela já são tratados pelo delegation
    b.addEventListener('click',function(evt){ abrirStatus(b.getAttribute('data-status'),evt); });
  });

  // Event delegation
  var tbl=document.getElementById('tbl-consol');
  if(tbl){
    tbl.addEventListener('click',function(evt){
      var chkBtn=evt.target.closest('[data-check]');
      if(chkBtn){toggleCheckRn(chkBtn.getAttribute('data-check'),evt);return;}
      var justBtn=evt.target.closest('[data-just]');
      if(justBtn){abrirJust(justBtn.getAttribute('data-just'),evt);return;}
      var stBtn=evt.target.closest('[data-status]');
      if(stBtn){abrirStatus(stBtn.getAttribute('data-status'),evt);return;}
      var td=evt.target.closest('[data-fid]');
      if(td){go('folha',td.getAttribute('data-fid'));return;}
      var tr=evt.target.closest('tr[data-fid]');
      if(tr){go('folha',tr.getAttribute('data-fid'));}
    });
  }
}


/* ===== REMUNERAÇÃO DE GERENTES (GV / GC) ===== */
// Folha própria do gerente logado (ligada por userId)
function minhaFolha(u){
  return (DB.folhas||[]).find(function(f){return f.userId===u.id;})||null;
}
// Folhas dos GVs que se reportam a um GC (mesmas operações do GC)
function equipeFolhas(u){
  if(u.papel!=='gc') return [];
  var ops=u.ops||[];
  // GVs dessas operações
  var gvIds=(DB.usuarios||[]).filter(function(x){
    return x.papel==='gv' && (x.ops||[]).some(function(o){return ops.includes(o);});
  }).map(function(x){return x.id;});
  // folhas de GV ligadas a esses logins
  return (DB.folhas||[]).filter(function(f){return f.userId&&gvIds.includes(f.userId);});
}

function pgMinhaRem(el,u){
  var mes=DB.config.mesRef;
  var ocultar=!!window._hideValores;
  var minha=minhaFolha(u);
  var equipe=equipeFolhas(u);

  var h='<div class="card"><h2>Minha Remuneração · '+mesLabel(mes)+'<span class="fill"></span>';
  h+='<button class="btn ghost sm" onclick="toggleValores()" title="'+(ocultar?'Exibir':'Ocultar')+' valores" style="font-size:16px;padding:6px 10px">'+(ocultar?'🙈':'👁')+'</button></h2>';

  if(!minha){
    h+='<div class="empty">Sua folha de remuneração ainda não foi vinculada ao seu acesso. Peça ao administrador para ligar sua folha em Cadastros → Folhas (campo "Vincular ao login").</div>';
  } else {
    var c=calcFolha(minha,mes);
    var p=perfilDe(minha);
    if(!c||!p){
      h+='<div class="empty">Perfil de remuneração não encontrado para sua folha.</div>';
    } else {
      var v=valorPago(minha.id,c.total,minha.base);
      // cartão de resumo
      h+='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px">';
      h+='<div class="chip" style="min-width:130px"><small>% Atingimento</small>'+fmtPct(c.atingTotal)+'</div>';
      h+='<div class="chip" style="min-width:130px"><small>Comissão</small>'+(ocultar?'R$ ••••':fmtBRL(v.pago))+'</div>';
      h+='<div class="chip" style="min-width:130px"><small>Perfil</small><span style="font-size:13px">'+esc(p.nome)+'</span></div>';
      h+='<button class="btn ghost sm no-print" style="align-self:center" onclick="go(\'folha\',\''+minha.id+'\')">Ver folha detalhada →</button>';
      h+='</div>';
      // tabela dos KPIs
      h+='<div class="tbl-wrap"><table class="data"><thead><tr>';
      h+='<th style="text-align:left">KPI</th><th>Peso</th><th>Meta</th><th>Real</th><th>% Ating</th><th>R$</th></tr></thead><tbody>';
      c.itens.forEach(function(i){
        h+='<tr><td class="l">'+esc(i.k)+'</td>';
        h+='<td>'+i.peso+'%</td>';
        h+='<td>'+(i.meta==null?'—':fmtN(i.meta,2))+'</td>';
        h+='<td>'+(i.real==null?'—':fmtN(i.real,2))+'</td>';
        h+='<td class="'+classAting(i.ating)+'">'+(i.ating==null?'—':fmtPct(i.ating))+'</td>';
        h+='<td style="text-align:right">'+(ocultar?'R$ ••••':'R$ '+fmtN(i.rs,2))+'</td></tr>';
      });
      h+='</tbody><tfoot><tr style="background:var(--navy);color:#fff;font-weight:800">';
      h+='<td colspan="4" style="text-align:left">TOTAL</td>';
      h+='<td class="'+classTotal(c.atingTotal)+'" style="color:#fff">'+fmtPct(c.atingTotal)+'</td>';
      h+='<td style="text-align:right">'+(ocultar?'R$ ••••':fmtBRL(v.pago))+'</td></tr></tfoot>';
      h+='</table></div>';
    }
  }
  h+='</div>';

  // Cascata: GC vê a remuneração dos GVs das operações dele
  if(u.papel==='gc' && equipe.length){
    h+='<div class="card"><h2>Remuneração da Equipe (GVs)<span class="fill"></span><span style="font-size:12px;color:var(--mut)">'+equipe.length+' gerente(s)</span></h2>';
    h+='<div class="tbl-wrap"><table class="data"><thead><tr>';
    h+='<th style="text-align:left">Gerente de Vendas</th><th>Operação</th><th>Perfil</th><th>% Ating</th><th>R$ Comissão</th></tr></thead><tbody>';
    var somaEq=0;
    equipe.map(function(f){return {f:f,c:calcFolha(f,mes)};}).filter(function(x){return x.c;})
      .sort(function(a,b){return b.c.atingTotal-a.c.atingTotal;})
      .forEach(function(x){
        var vv=valorPago(x.f.id,x.c.total,x.f.base);
        somaEq+=vv.pago;
        var op=opDe(x.f.op);
        var pp=perfilDe(x.f);
        h+='<tr class="click" onclick="go(\'folha\',\''+x.f.id+'\')" style="cursor:pointer">';
        h+='<td class="l"><b>'+esc(x.f.nome)+'</b></td>';
        h+='<td>'+(op?esc(op.nome):x.f.op)+'</td>';
        h+='<td style="font-size:12px">'+(pp?esc(pp.nome):'—')+'</td>';
        h+='<td class="'+classTotal(x.c.atingTotal)+'">'+fmtPct(x.c.atingTotal)+'</td>';
        h+='<td style="text-align:right"><b>'+(ocultar?'R$ ••••':fmtBRL(vv.pago))+'</b></td></tr>';
      });
    h+='</tbody><tfoot><tr style="background:var(--blue);color:#fff;font-weight:700">';
    h+='<td colspan="4" style="text-align:left">SOMA EQUIPE</td>';
    h+='<td style="text-align:right;font-family:\'Archivo\'">'+(ocultar?'R$ ••••••':fmtBRL(somaEq))+'</td></tr></tfoot>';
    h+='</table></div></div>';
  }

  el.innerHTML=h;
}

/* ===== CONSOLIDADO GV (admin — remuneração dos gerentes) ===== */
function pgConsolidadoGV(el,u){
  var mes=DB.config.mesRef;
  var ocultar=!!window._hideValores;
  // todas as folhas de perfil gerente
  var folhasGV=(DB.folhas||[]).filter(function(f){return ehPerfilGerente(f.perfil);});
  // filtro de operação
  var opSel=(PAGE_ARG&&PAGE_ARG.op!=null)?PAGE_ARG.op:'todas';
  var fs=folhasGV.slice();
  if(opSel!=='todas') fs=fs.filter(function(f){return f.op===+opSel;});

  var linhas=fs.map(function(f){return {f:f,c:calcFolha(f,mes)};}).filter(function(x){return x.c;})
    .sort(function(a,b){return a.f.op-b.f.op || b.c.atingTotal-a.c.atingTotal;});

  var optsOp='<option value="todas">Todas as operações</option>'+DB.operacoes.map(function(o){
    return '<option value="'+o.id+'" '+(''+o.id===''+opSel?'selected':'')+'>'+o.id+' — '+esc(o.nome)+'</option>';
  }).join('');

  var btnOlho='<button class="btn ghost sm" onclick="toggleValores()" title="'+(ocultar?'Exibir':'Ocultar')+' valores" style="font-size:16px;padding:6px 10px">'+(ocultar?'🙈':'👁')+'</button>';

  var h='<div class="card"><h2>Consolidado GV · '+mesLabel(mes)+'<span class="fill"></span>'+btnOlho+
    '<select onchange="setFiltro(\'op\',this.value)">'+optsOp+'</select></h2>';
  h+='<div class="help" style="margin-bottom:12px">Remuneração dos Gerentes de Vendas. Clique numa linha para abrir a folha detalhada.</div>';

  if(!linhas.length){
    h+='<div class="empty">Nenhuma folha de GV com lançamentos neste filtro.</div>';
  } else {

function darParecer(op,status){
  const mes=DB.config.mesRef;
  const ta=$('#pc_'+op), coment=(ta?ta.value:'').trim();
  if(status==='divergencia'&&!coment){toast('Descreva a divergência.');return;}
  DB.pareceres=DB.pareceres.filter(p=>!(p.mes===mes&&p.op===op&&p.userId===SESS.id));
  DB.pareceres.push({mes,op,userId:SESS.id,papel:SESS.papel,status,coment,data:new Date().toLocaleString('pt-BR')});
  persistValid();toast('Parecer registrado.');
}
function validarOp(op){
  const mes=DB.config.mesRef, st=statusOp(mes,op);
  if(st.tag==='diverg'&&!confirm('Há divergência. Validar mesmo assim?'))return;
  if(st.tag==='previa'&&!confirm('Nenhum parecer registrado. Validar mesmo assim?'))return;
  (DB.fechamento[mes]=DB.fechamento[mes]||{})[op]='validado';
  persistValid();toast('Operação validada e fechada.');
}
function reabrirOp(op){
  if(!confirm('Reabrir esta operação para ajustes?'))return;
  delete DB.fechamento[DB.config.mesRef][op];persistValid();
}

function pgImportar(el,u){
  const perfilSel=(PAGE_ARG&&PAGE_ARG.perfil)||(DB.perfis[0]&&DB.perfis[0].id);
  el.innerHTML=`<div class="card">
    <h2>Importar Excel · ${mesLabel(DB.config.mesRef)}<span class="fill"></span>
      <select onchange="setFiltro('perfil',this.value)">
        ${DB.perfis.map(x=>`<option value="${x.id}" ${x.id===perfilSel?'selected':''}>${esc(x.nome)}</option>`).join('')}
      </select>
    </h2>
    <div class="row" style="margin-bottom:14px">
      <button class="btn ghost" onclick="baixarModelo('${perfilSel}')">⬇ Baixar modelo (.xlsx)</button>
      <label class="btn yellow" style="display:inline-flex;align-items:center">
        ⬆ Escolher arquivo… <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importarXLSX(this,'${perfilSel}')">
      </label>
    </div>
    <div class="help">Colunas fixas: <b>SETOR, OPERACAO, NOME, BASE</b> + para cada KPI duas colunas <b>KPI META</b> e <b>KPI REAL</b>.<br>
    Folhas identificadas por SETOR+OPERACAO — criadas automaticamente se não existirem.</div>
    <div id="imp-result"></div>
  </div>`;
}
function baixarModelo(perfilId){
  const p=DB.perfis.find(x=>x.id===perfilId), mes=DB.config.mesRef;
  const head=['SETOR','OPERACAO','NOME','BASE'];
  p.kpis.forEach(k=>{head.push(k.k+' META',k.k+' REAL');});
  const rows=[head];
  DB.folhas.filter(f=>f.perfil===perfilId).forEach(f=>{
    const lc=(DB.lanc[mes]||{})[f.id]||{};
    const r=[f.setor,f.op,f.nome,f.base];
    p.kpis.forEach(k=>{const l=lc[k.k]||{};r.push(l.meta!=null?l.meta:'',l.real!=null?l.real:'');});
    rows.push(r);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Lancamentos');
  XLSX.writeFile(wb,'SISREM_modelo_'+perfilId+'_'+mes+'.xlsx');
}
function importarXLSX(inp,perfilId){
  const file=inp.files[0];if(!file)return;
  const p=DB.perfis.find(x=>x.id===perfilId), mes=DB.config.mesRef;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!data.length)throw new Error('Planilha vazia.');
      const head=data[0].map(h=>String(h).trim().toUpperCase());
      const ix=n=>head.indexOf(String(n).toUpperCase());
      const iSet=ix('SETOR'),iOp=ix('OPERACAO'),iNom=ix('NOME'),iBase=ix('BASE');
      if(iSet<0||iOp<0)throw new Error('Colunas SETOR e OPERACAO são obrigatórias.');
      const kpiCols=p.kpis.map(k=>({k:k.k,im:ix(k.k+' META'),ir:ix(k.k+' REAL')}));
      let novas=0,atualizadas=0,ignoradas=0;
      const num=v=>{if(v===''||v==null)return null;if(typeof v==='number')return v;let s=String(v).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=+s;return isNaN(n)?null:n;};
      data.slice(1).forEach(r=>{
        const setor=String(r[iSet]).trim(), op=+r[iOp];
        if(!setor||!op){ignoradas++;return;}
        let f=DB.folhas.find(x=>x.setor===setor&&x.op===op&&x.perfil===perfilId);
        if(!f){
          f={id:uid(),tipo:'RN',setor,op,nome:iNom>=0&&String(r[iNom]).trim()?String(r[iNom]).trim().toUpperCase():'SETOR '+setor,perfil:perfilId,base:iBase>=0&&num(r[iBase])!=null?num(r[iBase]):1000};
          DB.folhas.push(f);novas++;
        }else{
          if(iNom>=0&&String(r[iNom]).trim())f.nome=String(r[iNom]).trim().toUpperCase();
          if(iBase>=0&&num(r[iBase])!=null)f.base=num(r[iBase]);
          atualizadas++;
        }
        DB.lanc[mes]=DB.lanc[mes]||{};DB.lanc[mes][f.id]=DB.lanc[mes][f.id]||{};
        kpiCols.forEach(kc=>{
          const m=kc.im>=0?num(r[kc.im]):null, re=kc.ir>=0?num(r[kc.ir]):null;
          if(m==null&&re==null)return;
          const atual=DB.lanc[mes][f.id][kc.k]||{};
          if(m!=null)atual.meta=m; if(re!=null)atual.real=re;
          DB.lanc[mes][f.id][kc.k]=atual;
        });
      });
      persist(['config','lanc']);
      $('#imp-result').innerHTML='<div class="help" style="color:var(--green);font-weight:600;margin-top:12px">Importação concluída ✔ — '+atualizadas+' atualizada(s), '+novas+' criada(s)'+(ignoradas?', '+ignoradas+' ignorada(s)':'')+'. <button class="btn sm" style="margin-left:10px" onclick="go(\'consolidado\')">Ver consolidado</button></div>';
      toast('Excel importado com sucesso.');
    }catch(err){
      $('#imp-result').innerHTML='<div class="help" style="color:var(--red);font-weight:600;margin-top:12px">Falha: '+esc(err.message)+'</div>';
    }
    inp.value='';
  };
  reader.readAsArrayBuffer(file);
}

function cadFolhas(el){
  // filtro de operação
  const opFil = (window._cadFolhasOp != null) ? window._cadFolhasOp : 'todas';
  const busca = (window._cadFolhasBusca || '').toLowerCase();

  let fs = DB.folhas.slice().sort((a,b)=>a.op-b.op||a.setor.localeCompare(b.setor));
  if(opFil !== 'todas') fs = fs.filter(f => f.op === +opFil);
  if(busca) fs = fs.filter(f => f.nome.toLowerCase().includes(busca) || f.setor.includes(busca));

  let h = '';

  h += '<div class="row">';

  h += '</select></div>';
  h += '<div class="fld" style="flex:1"><label>Nome completo</label><input id="nf_nome" style="width:100%" placeholder="NOME COMPLETO"></div>';
  h += '<div class="fld"><label>Perfil RN</label><select id="nf_perfil">';

  h += '<div class="fld"><label>Base (R$)</label><input id="nf_base" type="number" value="1000" style="width:100px"></div>';

  h += '<thead><tr><th>Setor</th><th style="text-align:left">Nome</th><th>Operação</th>';
  h += '<th>Perfil RN</th><th>KPIs</th><th>Base R$</th><th>Vínculo GV</th><th></th></tr></thead><tbody>';

  fs.forEach(function(f){
    const op  = opDe(f.op);
    const p   = perfilDe(f);
    const isReserva = f.perfil==='rn_reserva'||!f.setor||f.setor.trim()==='';
    const optsP = DB.perfis.map(function(pp){
      return '<option value="'+pp.id+'" '+(f.perfil===pp.id?'selected':'')+'>'+esc(pp.nome)+'</option>';
    }).join('');
    const setorLabel = isReserva
      ? '<span style="background:var(--amber);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">RESERVA</span>'
      : '<b>'+f.op+'_'+esc(f.setor)+'</b>';

    h += '<tr'+(isReserva?' style="background:var(--amber-soft)"':'')+'>'; 
    h += '<td>'+setorLabel+'</td>';
    h += '<td class="l">'+esc(f.nome)+'</td>';
    h += '<td>'+esc(op ? op.nome : f.op)+'</td>';
    // select de perfil inline — ao mudar já atualiza e mostra os KPIs
    h += '<td><select style="font-size:12px" onchange="setPerfil(\''+f.id+'\',this.value)">'+optsP+'</select></td>';

      var gvsOp=DB.usuarios.filter(function(uu){return uu.papel==='gv'&&(uu.ops||[]).includes(f.op);});

      h += '<td style="text-align:center;color:var(--line)">—</td>';
    }
    h += '<td><button class="btn danger sm" onclick="delFolha(\''+f.id+'\')">Excluir</button></td>';
    h += '</tr>';
  });

  h += '</tbody></table></div>';
  el.innerHTML = h;
}
/* vincular folha de gerente a um login */
function setFolhaUser(fid, userId){
  var f=DB.folhas.find(function(x){return x.id===fid;});
  if(!f) return;
  if(userId) f.userId=userId; else delete f.userId;
  persistConfig();
  toast(userId?'Folha vinculada ao login.':'Vínculo removido.');
}
/* helpers de filtro para cadFolhas */
function cadFolhasSetOp(v){ window._cadFolhasOp=v; cadFolhas($('#cad')); }
function cadFolhasBusca(v){ window._cadFolhasBusca=v; cadFolhas($('#cad')); }
function setPerfil(id, perfilId){
  const f = DB.folhas.find(x=>x.id===id);
  if(!f) return;
  f.perfil = perfilId;
  persistConfig();
  // atualizar só a célula de KPIs sem re-renderizar tudo
  const p = perfilDe(f);
  const cell = document.getElementById('kpi_'+id);
  if(cell && p){
    let html2 = '';
    p.kpis.forEach(function(k){
      const cor = k.cat==='Volume'?'var(--blue)':'var(--green)';
      html2 += '<span style="display:inline-block;background:#F0F4F8;border-radius:4px;padding:1px 5px;margin:1px;font-size:10px;color:'+cor+';font-weight:600">'+k.k+' '+k.peso+'%</span>';
    });
    cell.innerHTML = html2;
  }
  toast('Perfil atualizado: '+f.nome+' → '+(p?p.nome:''));
}

function setBase(id,v){const f=DB.folhas.find(x=>x.id===id);if(f){f.base=+v||0;persistConfig();}}
function addFolha(){
  const setor=$('#nf_setor').value.trim(),op=+$('#nf_op').value,nome=$('#nf_nome').value.trim().toUpperCase(),perfil=$('#nf_perfil').value;
  if(!nome){toast('Preencha o nome.');return;}
  const isReserva = perfil==='rn_reserva'||!setor;
  if(!isReserva && DB.folhas.some(f=>f.setor===setor&&f.op===op&&f.perfil===perfil)){toast('Já existe folha com este setor/operação/perfil.');return;}
  const fid = isReserva ? uid() : op+'_'+setor;
  DB.folhas.push({id:fid,tipo:'RN',setor,op,nome,perfil,base:+$('#nf_base').value||0,reserva:isReserva});
  persistConfig();renderCad();toast(isReserva?'RN Reserva cadastrado!':'Folha cadastrada.');
}
function delFolha(id){
  if(!confirm('Excluir esta folha e todos os seus lançamentos?'))return;
  DB.folhas=DB.folhas.filter(f=>f.id!==id);
  Object.values(DB.lanc).forEach(m=>{delete m[id];});
  persistConfig();renderCad();
}
function cadPerfis(el){
  const cats=['Volume','Performance','Outros'];
  let h='<div class="help" style="margin-bottom:16px;padding:12px;background:var(--blue-soft);border-radius:8px">'+
    'Configure os KPIs e pesos de cada perfil. A soma deve ser exatamente <b>100%</b>. '+
    'Atingimento limitado a 125% por item.</div>';
  h+='<div class="row" style="margin-bottom:18px">'+
    '<div class="fld"><label>Nome do novo perfil</label>'+
    '<input id="np_nome" style="width:280px" placeholder="Ex.: RN ESPECIAL"></div>'+
    '<button class="btn" onclick="addPerfil()">+ Criar perfil</button></div>';

  DB.perfis.forEach(function(p){
    const soma=p.kpis.reduce(function(s,k){return s+(+k.peso||0);},0);
    const somaOk=soma===100;
    const cor=somaOk?'var(--green)':'var(--amber)';
    const bgCor=somaOk?'var(--green-soft)':'var(--amber-soft)';
    const tagCls=somaOk?'validado':'parcial';
    const tagTxt=somaOk?'✔ Pesos OK':'⚠ Soma: '+soma+'% (precisa ser 100%)';

    h+='<div class="card" style="box-shadow:none;border:2px solid '+cor+';margin-bottom:16px">';
    h+='<h2 style="font-size:15px;margin-bottom:16px">'+esc(p.nome)+
       '<span class="fill"></span>'+
       '<span class="tag '+tagCls+'" style="font-size:12px;padding:4px 12px">'+tagTxt+'</span>'+
       '<button class="btn danger sm" onclick="delPerfil(\''+p.id+'\')">Excluir perfil</button></h2>';

    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:12px">';
    p.kpis.forEach(function(k,i){
      const optsCat=cats.map(function(c){return '<option '+(k.cat===c?'selected':'')+'>'+c+'</option>';}).join('');
      h+='<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#FAFCFE">';
      h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">';
      h+='<input value="'+esc(k.k)+'" style="flex:1;font-weight:600;font-size:13px" onchange="renKPI(\''+p.id+'\','+i+',this.value)">';
      h+='<button class="btn danger sm" onclick="delKPI(\''+p.id+'\','+i+')" style="padding:3px 8px">✕</button></div>';
      h+='<div style="display:flex;gap:8px">';
      h+='<div class="fld" style="flex:1"><label>Peso %</label>'+
         '<input type="number" min="0" max="100" step="1" value="'+k.peso+'"'+
         ' style="width:100%;text-align:right;font-size:15px;font-weight:700;color:var(--navy)"'+
         ' onchange="setPeso(\''+p.id+'\','+i+',this.value)"></div>';
      h+='<div class="fld" style="flex:1"><label>Categoria</label>'+
         '<select onchange="setCat(\''+p.id+'\','+i+',this.value)">'+optsCat+'</select></div>';
      h+='</div>';
      // toggle "Teto no 100%" — KPI medido de 0 a 100% em que bater 100% paga 125%
      h+='<label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--mut);cursor:pointer" title="Marque para KPIs medidos de 0 a 100% (ex: Atendimento Produtivo). Atingir 100% paga o teto de 125%.">'+
         '<input type="checkbox" '+(k.tetoNoMax?'checked':'')+' onchange="setTetoMax(\''+p.id+'\','+i+',this.checked)">'+
         'Bater 100% paga teto (125%)</label>';
      h+='</div>';
    });
    // botão adicionar KPI
    h+='<div style="border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;'+
       'justify-content:center;min-height:80px;cursor:pointer" onclick="addKPI(\''+p.id+'\')">';
    h+='<span style="color:var(--mut);font-size:13px;font-weight:600">+ Adicionar KPI</span></div>';
    h+='</div>'; // fecha grid

    // barra de soma
    let msg=somaOk?'Perfeito — os pesos somam 100%.':
            soma>100?'Reduza '+(soma-100)+'% nos KPIs acima.':
            'Faltam '+(100-soma)+'% — distribua nos KPIs acima.';
    if(p.kpis.length>0){
      const maxPeso=Math.max.apply(null,p.kpis.map(function(k){return k.peso;}));
      msg+=' <span style="float:right;font-size:12px;color:var(--mut)">'+
           p.kpis.length+' KPI(s) · maior peso: '+maxPeso+'% = R$ '+maxPeso*10+' por R$1.000 de base</span>';
    }
    h+='<div style="background:'+bgCor+';border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px">';
    h+='<span style="font-family:\'Archivo\';font-weight:800;font-size:22px;color:'+cor+'">'+soma+'%</span>';
    h+='<span style="font-size:13px">'+msg+'</span></div>';
    // campo de teto de remuneração (opcional)
    var tetoPadrao=/^g[vc]\b|^g[vc]\s|gerente/i.test(p.nome)?2250:0;
    var tetoAtual=(p.teto!=null)?p.teto:tetoPadrao;
    h+='<div style="margin-top:10px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F8FAFC;border-radius:8px">';
    h+='<label style="font-size:12px;font-weight:600;color:var(--navy)">💰 Teto de remuneração (R$):</label>';
    h+='<input type="number" min="0" step="50" value="'+tetoAtual+'" style="width:120px;text-align:right;font-weight:700" onchange="setTeto(\''+p.id+'\',this.value)">';
    h+='<span style="font-size:11px;color:var(--mut)">0 = sem teto. Corta o valor final se ultrapassar.</span>';
    h+='</div>';
    h+='</div>'; // fecha card
  });

  el.innerHTML=h;
}

function setPeso(pid,i,v){DB.perfis.find(x=>x.id===pid).kpis[i].peso=+v||0;persistConfig();renderCad();}
function setCat(pid,i,v){DB.perfis.find(x=>x.id===pid).kpis[i].cat=v;persistConfig();}
function setTeto(pid,v){var p=DB.perfis.find(x=>x.id===pid);p.teto=+v||0;persistConfig();toast('Teto atualizado: '+(p.teto>0?'R$ '+fmtN(p.teto,0):'sem teto'));}
function setTetoMax(pid,i,v){DB.perfis.find(x=>x.id===pid).kpis[i].tetoNoMax=!!v;persistConfig();renderCad();}
function delKPI(pid,i){DB.perfis.find(x=>x.id===pid).kpis.splice(i,1);persistConfig();renderCad();}
function addKPI(pid){DB.perfis.find(x=>x.id===pid).kpis.push({k:'NOVO KPI',peso:0,cat:'Volume'});persistConfig();renderCad();}
function renKPI(pid,i,novo){
  const p=DB.perfis.find(x=>x.id===pid),antigo=p.kpis[i].k;
  p.kpis[i].k=novo.trim().toUpperCase();
  Object.values(DB.lanc).forEach(m=>Object.values(m).forEach(fl=>{if(fl[antigo]){fl[p.kpis[i].k]=fl[antigo];delete fl[antigo];}}));
  persistConfig();renderCad();
}
function addPerfil(){
  const nome=$('#np_nome').value.trim().toUpperCase();
  if(!nome){toast('Dê um nome ao perfil.');return;}
  DB.perfis.push({id:uid(),nome,kpis:[{k:'CERV TOTAL',peso:0,cat:'Volume'}]});
  persistConfig();renderCad();
}
function delPerfil(id){
  if(DB.folhas.some(f=>f.perfil===id)){toast('Há folhas usando este perfil.');return;}
  if(!confirm('Excluir este perfil?'))return;
  DB.perfis=DB.perfis.filter(p=>p.id!==id);persistConfig();renderCad();
}

function atualizarProgressoOp(){
  const mes = DB.config.mesRef;
  const uid2 = SESS.id;
  const fs = folhasVisiveis(SESS);
  // agrupar por operação
  const opIds = [...new Set(fs.map(function(f){return f.op;}))];
  opIds.forEach(function(opId){
    const fsDaOp = fs.filter(function(f){return f.op===opId;});
    const total = fsDaOp.length;
    const checks = fsDaOp.filter(function(f){
      return ((DB.checkRns[mes]||{})[uid2+'_'+f.id]);
    }).length;
    // atualizar barra
    const bar = document.getElementById('prog-fill-'+opId);
    const label = document.getElementById('prog-label-'+opId);
    const status = document.getElementById('prog-status-'+opId);
    if(bar) bar.style.width = (total?Math.round(checks/total*100):0)+'%';
    if(label) label.textContent = checks+'/'+total+' aprovados';
    if(status){
      if(checks===total && total>0){
        status.className='status-op-check completo';
        status.innerHTML='✔ Todos aprovados — pronto para validar!';
      } else if(checks>0){
        status.className='status-op-check parcial';
        status.innerHTML='⏳ '+checks+' de '+total+' aprovados';
      } else {
        status.className='status-op-check vazio';
        status.innerHTML='○ Nenhum revisado ainda';
      }
    }
  });
}

/* Retorna resumo de checks para uma operação (usado pelo admin) */
function resumoChecksOp(mes, opId){
  var fs = DB.folhas.filter(function(f){return f.op===opId;});
  var gvsDaOp = DB.usuarios.filter(function(u){
    return u.papel==='gv' && (u.ops||[]).includes(opId);
  });
  var result = [];
  gvsDaOp.forEach(function(gv){
    var fsDaGv = fs.filter(function(f){
      if(!gv.setores||!gv.setores.trim()) return true;
      var st=gv.setores.split(',').map(function(s){return s.trim();});
      return st.includes(f.setor);
    });
    var total = fsDaGv.length;
    var checks = fsDaGv.filter(function(f){
      return ((DB.checkRns[mes]||{})[gv.id+'_'+f.id]);
    }).length;
    result.push({gv:gv, total:total, checks:checks});
  });
  return result;
}

async function limparDados(tipo){
  const mes = DB.config.mesRef;
  const rotulos = {
    checks:    'as aprovações "De acordo" dos GVs',
    justs:     'as justificativas e observações',
    pareceres: 'os pareceres e o fechamento (validação)',
    tudo:      'TODOS os checks, justificativas, pareceres e fechamento'
  };
  const alvo = rotulos[tipo] || 'os dados selecionados';

  if(!confirm('Isso vai apagar '+alvo+' do mês '+mesLabel(mes)+'.\n\nOs lançamentos (metas/reais) NÃO são afetados.\n\nDeseja continuar?')) return;
  // segunda confirmação para "tudo"
  if(tipo==='tudo' && !confirm('Tem certeza? Esta ação é irreversível.')) return;

  if(tipo==='checks' || tipo==='tudo'){
    if(DB.checkRns && DB.checkRns[mes]) DB.checkRns[mes] = {};
  }
  if(tipo==='justs' || tipo==='tudo'){
    DB.justificativas = (DB.justificativas||[]).filter(function(j){ return j.mes !== mes; });
  }
  if(tipo==='pareceres' || tipo==='tudo'){
    DB.pareceres = (DB.pareceres||[]).filter(function(p){ return p.mes !== mes; });
    if(DB.fechamento && DB.fechamento[mes]) delete DB.fechamento[mes];
  }

  await persist(['valid']);
  toast('Dados limpos: '+alvo+'.');
  render();
}


// Calcula o valor efetivamente pago aplicando as regras de status.
// Retorna {pago, total, obs, cor} — obs é uma nota curta, cor destaca a linha.
// teto (R$) do perfil da folha, se configurado — folhas de GV têm teto padrão 2250
function tetoDaFolha(folhaId){
  var f=DB.folhas.find(function(x){return x.id===folhaId;});
  if(!f) return null;
  var p=perfilDe(f);
  if(!p) return null;
  // teto explícito no perfil
  if(p.teto!=null && p.teto>0) return p.teto;
  // padrão: perfis de gerente têm teto de 2250
  if(ehPerfilGerente(p.id)) return 2250;
  return null;
}
function valorPago(folhaId, total, base){
  var s=statusDoRN(folhaId);
  var res;
  if(!s){
    res={pago:total, total:total, obs:'', cor:''};
  } else if(s.tipo==='novo'){
    var modo=s.novoModo||'garantido';
    if(modo==='garantido'){
      res={pago:base, total:total, obs:'100% garantido', cor:'novo'}; // 100% da base
    } else {
      res={pago:total, total:total, obs:'valor real', cor:'novo'};
    }
  } else {
    // Férias / Atestado: proporcional aos dias trabalhados
    var fator=fatorDias(folhaId);
    if(fator<1){
      var dias=diasAusencia(folhaId);
      res={pago:total*fator, total:total, obs:(30-dias)+'/30d', cor:'aus'};
    } else {
      res={pago:total, total:total, obs:'', cor:''};
    }
  }
  // Aplicar teto do perfil (ex: GV = R$ 2.250) — corta o valor final
  var teto=tetoDaFolha(folhaId);
  if(teto!=null && res.pago>teto){
    res.pago=teto;
    res.obs=(res.obs?res.obs+' · ':'')+'teto R$ '+fmtN(teto,0);
    res.cor=res.cor||'teto';
  }
  return res;
}

// Célula de comissão no consolidado
function comissaoCell(folhaId,total,ocultar){
  var f=DB.folhas.find(function(x){return x.id===folhaId;});
  var base=f?f.base:0;
  var v=valorPago(folhaId,total,base);
  if(ocultar){
    return '<b><span style="letter-spacing:2px;color:var(--mut)">R$ ••••••</span></b>';
  }
  if(!v.obs){
    return '<b>'+fmtBRL(v.pago)+'</b>';
  }
  var cor=v.cor==='novo'?'var(--green)':'var(--blue)';
  var linhaOrig='';
  if(Math.abs(v.pago-v.total)>0.005){
    linhaOrig='<br><span style="font-size:10px;color:var(--mut);text-decoration:line-through">'+fmtBRL(v.total)+'</span><span style="font-size:10px;color:var(--mut)"> · '+v.obs+'</span>';
  } else {
    linhaOrig='<br><span style="font-size:10px;color:var(--mut)">'+v.obs+'</span>';
  }
  return '<b style="color:'+cor+'">'+fmtBRL(v.pago)+'</b>'+linhaOrig;
}

/* ===== MARCADORES DE STATUS (Férias / Atestado / Novo) + OBS FERISTA ===== */
// STATUS_INFO movido para o topo do script

// rnStatus[mes][folhaId] pode ser string (formato antigo) ou {tipo, dias}
function statusDoRN(folhaId){
  var mes=DB.config.mesRef;
  var v=((DB.rnStatus||{})[mes]||{})[folhaId];
  if(!v) return null;
  if(typeof v==='string') return {tipo:v, dias:0};   // compat formato antigo
  return v;
}
// dias de ausência (férias/atestado) — usado para pagar proporcional
function diasAusencia(folhaId){
  var s=statusDoRN(folhaId);
  if(!s) return 0;
  if(s.tipo==='ferias'||s.tipo==='atestado') return +s.dias||0;
  return 0;
}
// fator de pagamento: (30 - ausência)/30, limitado entre 0 e 1
function fatorDias(folhaId){
  var d=diasAusencia(folhaId);
  if(d<=0) return 1;
  var f=(30-d)/30;
  return f<0?0:(f>1?1:f);
}
function statusTag(folhaId){
  var s=statusDoRN(folhaId);
  if(!s||!STATUS_INFO[s.tipo]) return '';
  var extra='';
  if((s.tipo==='ferias'||s.tipo==='atestado')&&s.dias>0){
    extra=' '+s.dias+'d';
  }
  return '<span class="rn-tag '+STATUS_INFO[s.tipo].cls+'">'+STATUS_INFO[s.tipo].lbl+extra+'</span>';
}
function abrirStatus(folhaId,evt){
  if(evt) evt.stopPropagation();
  var f=DB.folhas.find(function(x){return x.id===folhaId;});
  var atual=statusDoRN(folhaId);
  var tipoAtual=atual?atual.tipo:null;
  var diasAtual=atual?(atual.dias||0):0;
  var body='<div class="modal-bg" id="just-modal" onclick="fecharJust(event)">';
  body+='<div class="modal" style="max-width:380px" onclick="event.stopPropagation()">';
  body+='<h3>⚑ Marcar situação<br><small style="font-family:\'IBM Plex Sans\';font-weight:500;color:var(--mut);font-size:13px">'+esc(f?f.nome:'')+'</small></h3>';
  body+='<div style="display:flex;flex-direction:column;gap:8px">';
  [['ferias','🏖️ Férias'],['atestado','🏥 Atestado'],['novo','🆕 RN Novo']].forEach(function(o){
    var sel=tipoAtual===o[0];
    body+='<button class="btn '+(sel?'':'ghost')+'" onclick="selStatusTipo(\''+o[0]+'\')" data-sttipo="'+o[0]+'" style="justify-content:flex-start">'+o[1]+(sel?' ✓':'')+'</button>';
  });
  body+='</div>';
  // campo de dias (aparece só para férias/atestado)
  var mostraDias=(tipoAtual==='ferias'||tipoAtual==='atestado');
  body+='<div id="st-dias-wrap" style="margin-top:14px;'+(mostraDias?'':'display:none')+'">';
  body+='<div class="fld"><label>Dias de ausência (férias/atestado)</label>';
  body+='<input type="number" min="0" max="30" id="st-dias" value="'+diasAtual+'" style="width:100%" placeholder="Ex: 12"></div>';
  body+='<div id="st-preview" class="help" style="margin-top:6px"></div>';
  body+='</div>';
  // bloco RN Novo — escolher piso garantido ou valor real
  var modoAtual=atual?(atual.novoModo||'garantido'):'garantido';
  var mostraNovo=(tipoAtual==='novo');
  body+='<div id="st-novo-wrap" style="margin-top:14px;'+(mostraNovo?'':'display:none')+'">';
  body+='<div class="fld"><label>Como pagar o RN Novo (até 90 dias)</label></div>';
  body+='<div style="display:flex;flex-direction:column;gap:6px">';
  body+='<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px"><input type="radio" name="novomodo" value="garantido" '+(modoAtual==='garantido'?'checked':'')+' onchange="atualizarPreviewNovo(\''+folhaId+'\')"><b>100% garantido</b> — paga como se atingisse 100%</label>';
  body+='<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px"><input type="radio" name="novomodo" value="real" '+(modoAtual==='real'?'checked':'')+' onchange="atualizarPreviewNovo(\''+folhaId+'\')"><b>Valor real</b> — paga o atingimento real (se passou de 100%)</label>';
  body+='</div>';
  body+='<div id="st-preview-novo" class="help" style="margin-top:8px"></div>';
  body+='</div>';
  body+='<div style="display:flex;gap:8px;margin-top:16px">';
  body+='<button class="btn ghost sm" style="flex:1;color:var(--red)" onclick="setStatus(\''+folhaId+'\',\'\')">✕ Remover</button>';
  body+='<button class="btn sm" style="flex:2" onclick="salvarStatus(\''+folhaId+'\')">Salvar</button>';
  body+='</div>';
  body+='</div></div>';
  var ant=document.getElementById('just-modal'); if(ant) ant.remove();
  document.body.insertAdjacentHTML('beforeend',body);
  window._stTipoSel=tipoAtual;
  atualizarPreviewDias(folhaId);
  atualizarPreviewNovo(folhaId);
  var inp=document.getElementById('st-dias');
  if(inp) inp.addEventListener('input',function(){ atualizarPreviewDias(folhaId); });
}
function selStatusTipo(tipo){
  window._stTipoSel = (window._stTipoSel===tipo)?null:tipo;
  // atualizar visual dos botões
  document.querySelectorAll('[data-sttipo]').forEach(function(b){
    var t=b.getAttribute('data-sttipo');
    var on=(t===window._stTipoSel);
    b.className='btn '+(on?'':'ghost')+'';
    b.style.justifyContent='flex-start';
  });
  // mostrar/ocultar campo dias
  var wrap=document.getElementById('st-dias-wrap');
  if(wrap) wrap.style.display=(window._stTipoSel==='ferias'||window._stTipoSel==='atestado')?'':'none';
  var wrapN=document.getElementById('st-novo-wrap');
  if(wrapN) wrapN.style.display=(window._stTipoSel==='novo')?'':'none';
}
function atualizarPreviewNovo(folhaId){
  var prev=document.getElementById('st-preview-novo');
  if(!prev) return;
  if(window._stTipoSel!=='novo'){ prev.textContent=''; return; }
  var modo='garantido';
  var r=document.querySelector('input[name=novomodo]:checked');
  if(r) modo=r.value;
  var f=DB.folhas.find(function(x){return x.id===folhaId;});
  var c=f?calcFolha(f,DB.config.mesRef):null;
  if(!c){ prev.textContent=''; return; }
  var vGar=f.base; // 100% da base
  var realMaior=c.total>vGar;
  if(modo==='garantido'){
    var aviso=realMaior?' <span style="color:var(--amber);font-weight:700">⚠ O real ('+fmtBRL(c.total)+') é maior — considere "Valor real"</span>':'';
    prev.innerHTML='Paga <b>'+fmtBRL(vGar)+'</b> (100% garantido).'+aviso;
  } else {
    prev.innerHTML='Paga o real: <b>'+fmtBRL(c.total)+'</b>'+(c.total<vGar?' <span style="color:var(--red)">(abaixo do garantido '+fmtBRL(vGar)+' — considere "100% garantido")</span>':' <span style="color:var(--green)">(acima de 100% ✓)</span>');
  }
}
function atualizarPreviewDias(folhaId){
  var prev=document.getElementById('st-preview');
  if(!prev) return;
  var tipo=window._stTipoSel;
  if(tipo!=='ferias'&&tipo!=='atestado'){ prev.textContent=''; return; }
  var inp=document.getElementById('st-dias');
  var dias=inp?(+inp.value||0):0;
  var trab=30-dias; if(trab<0) trab=0;
  var f=DB.folhas.find(function(x){return x.id===folhaId;});
  var c=f?calcFolha(f,DB.config.mesRef):null;
  var msg='Trabalhou '+trab+' de 30 dias → paga '+trab+'/30';
  if(c){
    var pago=c.total*(trab/30);
    msg+=' = '+fmtBRL(pago)+' (de '+fmtBRL(c.total)+')';
  }
  prev.innerHTML=msg;
}
function salvarStatus(folhaId){
  var tipo=window._stTipoSel;
  if(!tipo){ setStatus(folhaId,''); return; }
  var dias=0, novoModo=null;
  if(tipo==='ferias'||tipo==='atestado'){
    var inp=document.getElementById('st-dias');
    dias=inp?(+inp.value||0):0;
    if(dias<0) dias=0; if(dias>30) dias=30;
  }
  if(tipo==='novo'){
    var r=document.querySelector('input[name=novomodo]:checked');
    novoModo=r?r.value:'garantido';
  }
  var mes=DB.config.mesRef;
  DB.rnStatus=DB.rnStatus||{}; DB.rnStatus[mes]=DB.rnStatus[mes]||{};
  var reg={tipo:tipo,dias:dias};
  if(novoModo) reg.novoModo=novoModo;
  DB.rnStatus[mes][folhaId]=reg;
  persist(['valid']);
  var m=document.getElementById('just-modal'); if(m) m.remove();
  var extra=dias>0?' ('+dias+' dias)':(novoModo?' ('+(novoModo==='garantido'?'100% garantido':'valor real')+')':'');
  toast('Marcado como '+STATUS_INFO[tipo].lbl+extra);
  render();
}
function setStatus(folhaId,st){
  var mes=DB.config.mesRef;
  DB.rnStatus=DB.rnStatus||{}; DB.rnStatus[mes]=DB.rnStatus[mes]||{};
  if(st){ DB.rnStatus[mes][folhaId]={tipo:st,dias:0}; } else { delete DB.rnStatus[mes][folhaId]; }
  persist(['valid']);
  var m=document.getElementById('just-modal'); if(m) m.remove();
  toast(st?'Marcado como '+STATUS_INFO[st].lbl:'Marcação removida');
  render();
}

var _ferTimer=null;
function salvarFerista(folhaId,patch){
  var mes=DB.config.mesRef;
  DB.feristaObs=DB.feristaObs||{}; DB.feristaObs[mes]=DB.feristaObs[mes]||{};
  var reg=DB.feristaObs[mes][folhaId]||{obs:'',valor:0};
  reg=Object.assign(reg,patch,{userName:SESS.nome,userLogin:SESS.login||SESS.id,userPapel:SESS.papel,data:new Date().toLocaleString('pt-BR')});
  DB.feristaObs[mes][folhaId]=reg;
  clearTimeout(_ferTimer);
  _ferTimer=setTimeout(function(){ persist(['valid']); },500);
  toast('Salvo.');
}


/* ===== EXPORTAR REMUNERAÇÃO PARA EXCEL ===== */
function exportarRemuneracao(){
  var sel=document.getElementById('exp_mes');
  var mes=sel?sel.value:DB.config.mesRef;

  // Garantir que os lançamentos do mês estão carregados
  if(!DB.lanc[mes]){
    // carregar de forma síncrona não é possível; avisa e usa o que tiver
    toast('Carregando dados do mês… clique novamente se vier vazio.');
    carregarLanc(mes).then(function(){ exportarRemuneracao(); });
    return;
  }

  var linhas=[];
  // Cabeçalho
  linhas.push([
    'Operação','Cód. Op','Setor','Nome','Login vinculado','Tipo','Perfil',
    '% Atingimento','Comissão calculada (R$)','Ajuste','Dias ausência',
    'Valor final a pagar (R$)','Observação','Preenchido por'
  ]);

  function tipoFolha(f){
    if(ehPerfilGerente(f.perfil)) return 'GV';
    if(f.perfil==='rn_reserva'||f.reserva||!f.setor||String(f.setor).trim()==='') return 'FERISTA';
    return 'RN';
  }

  // ordenar: por operação, depois tipo (RN, FERISTA, GV), depois setor/nome
  var ordemTipo={'RN':0,'FERISTA':1,'GV':2};
  var folhas=DB.folhas.slice().sort(function(a,b){
    if(a.op!==b.op) return a.op-b.op;
    var ta=tipoFolha(a), tb=tipoFolha(b);
    if(ordemTipo[ta]!==ordemTipo[tb]) return ordemTipo[ta]-ordemTipo[tb];
    return String(a.setor||'').localeCompare(String(b.setor||''))||String(a.nome).localeCompare(String(b.nome));
  });

  var mesAnt=DB.config.mesRef;
  DB.config.mesRef=mes; // calcFolha usa o mês atual

  folhas.forEach(function(f){
    var tipo=tipoFolha(f);
    var op=opDe(f.op);
    var perfil=perfilDe(f);
    var usr=DB.usuarios.find(function(u){return u.id===f.userId;});

    // FERISTA: valor e observação vêm de feristaObs (digitados manualmente)
    if(tipo==='FERISTA'){
      var fo=((DB.feristaObs||{})[mes]||{})[f.id]||{};
      var autor=fo.userName?(fo.userName+(fo.userLogin?' ('+fo.userLogin+')':'')):'';
      linhas.push([
        op?op.nome:f.op, f.op, '(reserva)', f.nome, usr?usr.login:'',
        'FERISTA', perfil?perfil.nome:'',
        '', '', 'Valor manual', '',
        num2(fo.valor||0), fo.obs||'', autor
      ]);
      return;
    }

    // RN e GV: calcular
    var c=calcFolha(f,mes);
    if(!c){ return; }
    var v=valorPago(f.id,c.total,f.base);
    var s=statusDoRN(f.id);
    var ajuste='', obsDias='', dias='';
    if(s){
      if(s.tipo==='ferias'){ ajuste='Férias'; dias=s.dias||0; obsDias='Ausente '+dias+' dias — paga '+(30-dias)+'/30'; }
      else if(s.tipo==='atestado'){ ajuste='Atestado'; dias=s.dias||0; obsDias='Ausente '+dias+' dias — paga '+(30-dias)+'/30'; }
      else if(s.tipo==='novo'){
        var modo=s.novoModo||'garantido';
        ajuste='RN Novo ('+(modo==='garantido'?'100% garantido':'valor real')+')';
        obsDias=modo==='garantido'?'Piso de 100% da base':'Pago pelo atingimento real';
      }
    }
    linhas.push([
      op?op.nome:f.op, f.op, f.setor||'', f.nome, usr?usr.login:'',
      tipo, perfil?perfil.nome:'',
      round1(c.atingTotal)+'%', num2(c.total), ajuste, dias,
      num2(v.pago), obsDias, ''
    ]);
  });

  DB.config.mesRef=mesAnt; // restaurar

  // Montar planilha
  var ws=XLSX.utils.aoa_to_sheet(linhas);
  // largura das colunas
  ws['!cols']=[
    {wch:18},{wch:7},{wch:9},{wch:34},{wch:14},{wch:9},{wch:16},
    {wch:13},{wch:20},{wch:22},{wch:13},{wch:20},{wch:40},{wch:26}
  ];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Remuneração '+mes);
  XLSX.writeFile(wb,'SISREM_Remuneracao_'+mes+'.xlsx');
  toast('Planilha exportada!');
}
function num2(n){ return Math.round((+n||0)*100)/100; }
function round1(n){ return Math.round((+n||0)*10)/10; }
